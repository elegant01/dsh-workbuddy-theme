name: publish

# 打 tag（形如 v0.1.2）即发布：先校验 tag 与 package.json 版本一致，再发 npm、建 GitHub Release。
# 发布信息只有一个来源——package.json；tag 只是触发器。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 允许在 Actions 页面手动跑，便于排查认证问题

permissions:
  contents: write # 建 Release 需要

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # 不缓存 npm 依赖：本包零依赖，缓存只会多一次失败机会

      # tag 与 package.json 必须一致，否则发出去的版本号和 tag 对不上，
      # 事后谁也说不清 v0.1.2 到底对应哪份代码。
      - name: 校验 tag 与 package.json 版本一致
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag 与 package.json 的 $pkg 不一致。改 package.json 后重新打 tag。"
            exit 1
          fi

      # 装机前的健全性检查：这几项错了，包装上也是坏的（都是真踩过的坑）
      - name: 校验插件清单
        run: |
          node -e '
            const j = require("./package.json");
            const fs = require("fs");
            if (!j.dsh?.bundle?.patch) { console.error("缺少 dsh.bundle.patch —— 这样的包装不上"); process.exit(1); }
            if (!fs.existsSync(j.dsh.bundle.patch)) { console.error("dsh.bundle.patch 指向的文件不存在"); process.exit(1); }
            if (!j.main || !fs.existsSync(j.main)) { console.error("main 指向的文件不存在"); process.exit(1); }
            const m = fs.readFileSync("index.js", "utf8");
            if (!/^export const name\b/m.test(m) || !/^export function apply\b/m.test(m)) {
              console.error("index.js 必须具名导出 name 与 apply（default 导出会让加载器挂不上）");
              process.exit(1);
            }
            console.log("清单 OK:", j.name, j.version);
          '

      # 先确认 secret 真的传进来了、也真的能用。这一步失败说明是 token 的问题，
      # 而不是 npm publish 的其他毛病——省得对着 EOTP/ENEEDAUTH 瞎猜。
      - name: 校验 NPM_TOKEN 可用
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::secrets.NPM_TOKEN 为空，请检查仓库 Settings → Secrets。"
            exit 1
          fi
          echo "token 长度: ${#NODE_AUTH_TOKEN}"
          who="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $NODE_AUTH_TOKEN" https://registry.npmjs.org/-/whoami)"
          echo "whoami HTTP $who"
          # 401 = token 无效或已撤销
          if [ "$who" != "200" ]; then
            echo "::error::NPM_TOKEN 认证失败（HTTP $who）。请在 npmjs.com 重新生成 Automation token。"
            exit 1
          fi
          # 探一下写入能力：读权限的 token 会 here 报 401 "one-time pass"，
          # 说明它其实是 Publish（要 OTP）而不是 Automation。
          name="$(node -p "require('./package.json').name")"
          put="$(curl -s -o /tmp/put.txt -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $NODE_AUTH_TOKEN" -H 'Content-Type: application/json' \
            --data '{"_id":"'"$name"'","name":"'"$name"'","dist-tags":{"probe":"0.0.0"}}' \
            "https://registry.npmjs.org/$name")"
          echo "写权限探测 HTTP $put"
          if [ "$put" = "401" ] || grep -q "one-time pass" /tmp/put.txt; then
            echo "::error::该 token 仍要求 OTP —— 它不是 Automation 类型。请到 npmjs.com → Access Tokens 生成 Automation token 并替换 secrets.NPM_TOKEN。"
            exit 1
          fi

      - name: 发布到 npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # 关键：用注册表 scope 前缀传 token，别依赖 .npmrc 里的 ${NODE_AUTH_TOKEN} 展开
          # （npm 在某些版本/环境下不会展开该变量，直接静默失败成 ENEEDAUTH）。
          npm publish --access public \
            --//registry.npmjs.org/:_authToken="$NODE_AUTH_TOKEN"

      - name: 建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        run: |
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            "dsh-workbuddy-theme-*.tgz" 2>/dev/null || \
          gh release create "$tag" --title "$tag" --generate-notes
