name: publish

# 打 tag（形如 v0.1.2）触发：校验 tag 与 package.json 版本、校验插件清单、构建冒烟测试、
# 建 GitHub Release。
#
# 注意：这里**不**执行 npm publish。
# npm 账号开启 2FA 后（auth-and-writes / auth-only），任何 token —— 包括 Automation ——
# 发布会一律要求 OTP，CI 里拿不到。发布请在本机执行：
#     npm publish --registry=https://registry.npmjs.org/ --otp=<6位验证码>
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 允许在 Actions 页面手动跑

permissions:
  contents: write # 建 Release 需要

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # tag 与 package.json 必须一致，否则事后说不清 v0.1.2 到底对应哪份代码。
      - name: 校验 tag 与 package.json 版本一致
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag 与 package.json 的 $pkg 不一致。改 package.json 后重新打 tag。"
            exit 1
          fi

      # 装机前的健全性检查：这几项错了，包发出去也是坏的（都是真踩过的坑）
      - name: 校验插件清单
        run: |
          node -e '
            const j = require("./package.json");
            const fs = require("fs");
            if (!j.dsh?.bundle?.patch) { console.error("缺少 dsh.bundle.patch —— 这样的包装不上"); process.exit(1); }
            if (!fs.existsSync(j.dsh.bundle.patch)) { console.error("dsh.bundle.patch 指向的文件不存在"); process.exit(1); }
            if (!j.main || !fs.existsSync(j.main)) { console.error("main 指向的文件不存在"); process.exit(1); }
            const m = fs.readFileSync("index.js", "utf8");
            if (!/^export const name\b/m.test(m) || !/^export function apply\b/m.test(m)) {
              console.error("index.js 必须具名导出 name 与 apply（default 导出会让加载器挂不上）");
              process.exit(1);
            }
            console.log("清单 OK:", j.name, j.version);
          '

      - name: 构建冒烟测试
        run: |
          npm pack --dry-run
          node --input-type=module -e '
            const m = await import("./index.js");
            if (typeof m.apply !== "function" || !m.name) {
              throw new Error("index.js 必须具名导出 name 与 apply");
            }
            console.log("宿主端导出 OK:", m.name);
          '

      - name: 建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        run: |
          gh release create "$tag" --title "$tag" --generate-notes
