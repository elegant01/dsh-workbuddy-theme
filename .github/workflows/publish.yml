name: publish

# 发布 dsh-workbuddy-theme。
#   - npmjs：用 npm Trusted Publisher（OIDC）发布，免 token、免 OTP
#   - GitHub：建 Release
# 触发：GitHub Release 发布，或打 tag v*，或手动 workflow_dispatch。
#
# 前置（一次性，已在 npmjs.com 包设置页完成）：
#   Trusted Publisher = GitHub Actions / elegant01 / dsh-workbuddy-theme / publish.yml
#   —— 所以本文件的文件名不能改，改了 OIDC 就对不上。
on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # tag 与 package.json 必须一致，否则事后说不清 v0.3.0 到底对应哪份代码。
      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag 与 package.json 的 $pkg 不一致。改 package.json 后重新打 tag。"
            exit 1
          fi

      # 装机前的健全性检查：这几项错了，包发出去也是坏的（都是真踩过的坑）
      - name: 校验插件清单
        run: |
          node -e '
            const j = require("./package.json");
            const fs = require("fs");
            if (!j.dsh?.bundle?.patch) { console.error("缺少 dsh.bundle.patch —— 这样的包装不上"); process.exit(1); }
            if (!fs.existsSync(j.dsh.bundle.patch)) { console.error("dsh.bundle.patch 指向的文件不存在"); process.exit(1); }
            if (!j.main || !fs.existsSync(j.main)) { console.error("main 指向的文件不存在"); process.exit(1); }
            const m = fs.readFileSync("index.js", "utf8");
            if (!/^export const name\b/m.test(m) || !/^export function apply\b/m.test(m)) {
              console.error("index.js 必须具名导出 name 与 apply（default 导出会让加载器挂不上）");
              process.exit(1);
            }
            console.log("清单 OK:", j.name, j.version);
          '

      - name: 构建冒烟测试
        run: |
          npm pack --dry-run
          node --input-type=module -e '
            const m = await import("./index.js");
            if (typeof m.apply !== "function" || !m.name) {
              throw new Error("index.js 必须具名导出 name 与 apply");
            }
            console.log("宿主端导出 OK:", m.name);
          '

  publish-npmjs:
    name: Publish to npmjs (OIDC)
    needs: verify
    # npm Trusted Publisher（OIDC）：workflow 必须有 id-token: write，
    # npm CLI 自动检测 OIDC 环境并换取一次性发布凭证，无需任何 npm token。
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC 必需
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 注意：不设 registry-url —— OIDC 握手由 npm CLI 自动完成，
          # 显式 .npmrc 认证反而会干扰 trusted publisher 流程。
          node-version: '24' # 内置 npm >= 11，满足 OIDC/trusted publishing 要求

      - name: Publish with provenance
        run: npm publish --provenance --access public

  release:
    name: Create GitHub Release
    needs: publish-npmjs
    if: startsWith(github.ref, 'refs/tags/') && github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        run: |
          gh release create "$tag" --title "$tag" --generate-notes
